version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /examples/saas-reference
      - /tests/ecosystem
      - /tests/toolchain
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # First-party package versions move together through the release workflow.
    ignore:
      - dependency-name: '@thomas.f/prnext*'
      - dependency-name: 'prnext-*'
      # Babel needs a coordinated compiler migration; types track Node 22.
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
