name: Verify npm alpha artifacts

on:
  workflow_dispatch:
    inputs:
      reuse-published-native:
        description: Test the exact native archives already published for this version
        required: false
        default: false
        type: boolean
      reuse-published-unix-native:
        description: Reuse published macOS/Linux archives and build new Windows packages
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/npm-alpha-validation

# This workflow builds downloadable archives. It never publishes to npm.
permissions:
  contents: read

concurrency:
  group: npm-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-22.04
            platform: linux-x64-gnu
          - runner: ubuntu-22.04-arm
            platform: linux-arm64-gnu
          - runner: windows-2022
            platform: win32-x64-msvc
          - runner: windows-11-arm
            platform: win32-arm64-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      REUSE_PUBLISHED_NATIVE: ${{ (inputs.reuse-published-native == true || (inputs.reuse-published-unix-native == true && !startsWith(matrix.platform, 'win32-'))) && 'true' || 'false' }}
      ARTIFACT_DIRECTORY: ${{ (inputs.reuse-published-native == true || inputs.reuse-published-unix-native == true) && 'artifacts/npm-scoped' || 'artifacts/npm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - name: Install assembler (macOS)
        if: runner.os == 'macOS'
        run: command -v nasm >/dev/null || brew install nasm
      - name: Install assembler (Windows x64)
        if: matrix.platform == 'win32-x64-msvc'
        run: |
          choco install nasm --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run release:check
      - run: node --test scripts/npm-metadata.test.mjs
      - name: Check filesystem regressions before compiling Rust
        run: node --test packages/prnext/build/directory-cache.test.mjs packages/prnext/runtime/watch-project.test.mjs
      - run: node scripts/cargo.mjs build --release --locked
      - run: npm run test:unit
      - name: Verify isolated installs with both dependency layouts
        shell: bash
        run: |
          options=(--out "$ARTIFACT_DIRECTORY")
          if [ "$REUSE_PUBLISHED_NATIVE" = "true" ]; then
            options+=(--published-native)
          fi
          npm run test:package -- "${options[@]}"
          npm run test:package -- "${options[@]}" --nested
      - shell: bash
        run: npm run release:verify-artifacts -- --host --directory "$ARTIFACT_DIRECTORY"
      - name: Upload archives only after the isolated installation passes
        uses: actions/upload-artifact@v4
        with:
          name: npm-alpha-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_DIRECTORY }}/
          if-no-files-found: error
      - name: Preserve native assembly diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-diagnostics-${{ matrix.platform }}
          path: |
            target/release/build/rav1d-*/output
            target/release/build/rav1d-*/stderr
          if-no-files-found: ignore
