name: Verify npm alpha artifacts

on:
  workflow_dispatch:
    inputs:
      reuse-published-native:
        description: Test the exact native archives already published for this version
        required: false
        default: false
        type: boolean
      reuse-published-unix-native:
        description: Reuse published macOS/Linux archives and build new Windows packages
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/npm-alpha-validation

# This workflow builds downloadable archives. It never publishes to npm.
permissions:
  contents: read

concurrency:
  group: npm-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-22.04
            platform: linux-x64-gnu
          - runner: ubuntu-22.04-arm
            platform: linux-arm64-gnu
          - runner: windows-2022
            platform: win32-x64-msvc
          - runner: windows-11-arm
            platform: win32-arm64-msvc
    uses: ./.github/workflows/npm-platform.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      reuse-published: ${{ inputs.reuse-published-native == true || (inputs.reuse-published-unix-native == true && !startsWith(matrix.platform, 'win32-')) }}
