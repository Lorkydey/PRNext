name: Windows build-lock diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'Lorkydey/PRNext' && github.ref == 'refs/heads/fix/pr-maintenance-20261112'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1']
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ci-lock-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-lock-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lock-diagnostic/
          if-no-files-found: error
