name: CI platform

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native checks and build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    outputs:
      binary-artifact: ${{ steps.binary-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the dependency cache used by the previous single-job workflow.
          shared-key: test
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - name: Install assembler (macOS)
        if: runner.os == 'macOS'
        run: command -v nasm >/dev/null || brew install nasm
      - name: Install assembler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build:native
      - name: Share the tested native binary
        id: binary-upload
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release/prnext${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:rust

  javascript:
    name: ${{ matrix.suite }}
    needs: native
    # Continue the independent suites if Rust tests fail after a successful build.
    if: ${{ !cancelled() && needs.native.outputs.binary-artifact != '' }}
    strategy:
      fail-fast: false
      matrix:
        # Separate runners avoid concurrent writes to shared example build output.
        # Keep each suite's existing test concurrency and full platform coverage.
        suite: [unit-and-types, integration, browser]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release
      - name: Restore executable permission
        if: runner.os != 'Windows'
        run: chmod +x target/release/prnext
      - name: Unit tests
        if: matrix.suite == 'unit-and-types'
        run: npm run test:unit
      - name: Type checks (library and both example applications)
        if: ${{ !cancelled() && matrix.suite == 'unit-and-types' }}
        run: npm run test:types
      - name: Integration tests
        if: matrix.suite == 'integration'
        run: npm run test:e2e
      - name: Install Chromium
        if: matrix.suite == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: matrix.suite == 'browser'
        run: npm run test:browser
      - name: Upload browser failure diagnostics
        if: ${{ failure() && matrix.suite == 'browser' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics-${{ inputs.runner }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  next-compat:
    name: Next.js reference contracts
    needs: native
    if: ${{ !cancelled() && inputs.runner == 'ubuntu-24.04' && needs.native.outputs.binary-artifact != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release
      - run: chmod +x target/release/prnext
      - name: Install the pinned upstream reference separately
        run: npm install --prefix artifacts/next-reference --no-save --package-lock=false --ignore-scripts --no-audit --no-fund next@16.4.3 react@19.3.1 react-dom@19.3.1
      - run: npx playwright install --with-deps chromium
      - name: Prepare fixtures on the reference filesystem
        run: node -e "require('node:fs').mkdirSync('artifacts/next-fixtures', {recursive:true})"
      - name: Compare real builds, servers and browsers
        env:
          PRNEXT_NEXT_REFERENCE: ${{ github.workspace }}/artifacts/next-reference/node_modules/next
          PRNEXT_NEXT_REFERENCE_VERSION: '16.4.3'
          TMPDIR: ${{ github.workspace }}/artifacts/next-fixtures
        run: npm run test:next-compat
