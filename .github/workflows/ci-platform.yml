name: CI platform

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  native:
    name: Native checks and build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    outputs:
      binary-artifact: ${{ steps.binary-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: npm-cache
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          # Keep the dependency cache used by the previous single-job workflow.
          shared-key: test
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - name: Install assembler (macOS)
        if: runner.os == 'macOS'
        run: command -v nasm >/dev/null || brew install nasm
      - name: Install assembler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - run: npm ci
      - name: Identify native compilation inputs
        id: native-key
        run: node scripts/ci-native-cache.mjs key
      - uses: actions/cache/restore@v5
        if: steps.native-key.outputs.cacheable == 'true'
        id: binary-cache
        with:
          path: artifacts/ci-native-cache
          key: ${{ steps.native-key.outputs.key }}
      - name: Validate the exact cached binary
        id: native-restore
        if: steps.native-key.outputs.cacheable == 'true'
        run: node scripts/ci-native-cache.mjs restore --key "${{ steps.native-key.outputs.key }}"
      - run: npm run build:native -- --locked
        if: steps.native-restore.outputs.valid != 'true'
      - name: Seal the native compilation output
        if: steps.native-key.outputs.cacheable == 'true'
        run: node scripts/ci-native-cache.mjs seal --key "${{ steps.native-key.outputs.key }}"
      - uses: actions/cache/save@v5
        if: steps.native-key.outputs.cacheable == 'true' && steps.binary-cache.outputs.cache-hit != 'true'
        with:
          path: artifacts/ci-native-cache
          key: ${{ steps.native-key.outputs.key }}
      - name: Share the tested native binary
        id: binary-upload
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release/prnext${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1
      - name: Record setup cache results
        if: always()
        uses: ./.github/actions/ci-metrics
        with:
          runner: ${{ inputs.runner }}
          suite: native
          npm-cache: ${{ steps.npm-cache.outputs.cache-hit }}
          rust-cache: ${{ steps.rust-cache.outputs.cache-hit }}
          binary-cache: ${{ steps.native-restore.outputs.valid || 'false' }}

  native-checks:
    name: Rust formatting, lint and tests
    needs: native
    if: ${{ !cancelled() && needs.native.outputs.binary-artifact != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - name: Install assembler (macOS)
        if: runner.os == 'macOS'
        run: command -v nasm >/dev/null || brew install nasm
      - name: Install assembler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run test:rust

  javascript:
    name: ${{ matrix.suite }} (${{ matrix.shard }}/${{ matrix.shards }})
    needs: native
    # Continue the independent suites if Rust tests fail after a successful build.
    if: ${{ !cancelled() && needs.native.outputs.binary-artifact != '' }}
    strategy:
      fail-fast: false
      matrix:
        # Separate runners avoid concurrent writes to shared example build output.
        # Keep each suite's existing test concurrency and full platform coverage.
        include:
          - { suite: unit-and-types, shard: 1, shards: 1 }
          - { suite: integration, shard: 1, shards: 4 }
          - { suite: integration, shard: 2, shards: 4 }
          - { suite: integration, shard: 3, shards: 4 }
          - { suite: integration, shard: 4, shards: 4 }
          - { suite: browser, shard: 1, shards: 4 }
          - { suite: browser, shard: 2, shards: 4 }
          - { suite: browser, shard: 3, shards: 4 }
          - { suite: browser, shard: 4, shards: 4 }
    runs-on: ${{ inputs.runner }}
    # The complete Chromium suite exceeds 30 minutes locally before setup.
    # Preserve every per-test deadline and the shorter unit/integration budgets.
    timeout-minutes: ${{ matrix.suite == 'browser' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: npm-cache
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release
      - name: Restore executable permission
        if: runner.os != 'Windows'
        run: chmod +x target/release/prnext
      - name: Unit tests
        if: matrix.suite == 'unit-and-types'
        run: npm run test:unit
      - name: CI tooling regressions
        if: matrix.suite == 'unit-and-types'
        run: npm run test:ci
      - name: Type checks (library and both example applications)
        if: ${{ !cancelled() && matrix.suite == 'unit-and-types' }}
        run: npm run test:types
      - name: Install locked native TypeScript and Redis test clients
        if: matrix.suite == 'integration'
        run: npm ci --prefix tests/toolchain --workspaces=false --ignore-scripts --no-audit --no-fund
      - name: Install isolated Redis test executable (Linux)
        if: matrix.suite == 'integration' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install isolated Redis test executable (macOS)
        if: matrix.suite == 'integration' && runner.os == 'macOS'
        run: brew install redis
      - name: Prepare portable Redis test executable (Windows)
        if: matrix.suite == 'integration' && runner.os == 'Windows'
        run: node scripts/portable-redis.mjs --directory artifacts/redis-test
      - name: Integration tests
        if: matrix.suite == 'integration'
        run: node scripts/ci-shards.mjs --suite integration --shard ${{ matrix.shard }}/${{ matrix.shards }} --plan-output artifacts/ci-test-results/integration-plan.json
      - name: Install Chromium
        if: matrix.suite == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: matrix.suite == 'browser'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/ci-test-results/browser-results.json
        run: node scripts/ci-shards.mjs --suite browser --shard ${{ matrix.shard }}/${{ matrix.shards }} --plan-output artifacts/ci-test-results/browser-plan.json
      - name: Upload shard plans and browser timings
        if: ${{ always() && matrix.suite != 'unit-and-types' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-tests-${{ inputs.runner }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: artifacts/ci-test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser failure diagnostics
        if: ${{ failure() && matrix.suite == 'browser' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics-${{ inputs.runner }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record setup cache results
        if: always()
        uses: ./.github/actions/ci-metrics
        with:
          runner: ${{ inputs.runner }}
          suite: ${{ matrix.suite }}
          shard: ${{ matrix.shard }}
          npm-cache: ${{ steps.npm-cache.outputs.cache-hit }}

  browser-compat:
    name: Browser engine ${{ matrix.engine }}
    needs: native
    if: ${{ !cancelled() && inputs.runner == 'ubuntu-24.04' && needs.native.outputs.binary-artifact != '' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: npm-cache
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release
      - run: chmod +x target/release/prnext
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser:compat
        env:
          PRNEXT_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-compat-${{ matrix.engine }}
          path: artifacts/alpha019-cross-engine-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record setup cache results
        if: always()
        uses: ./.github/actions/ci-metrics
        with:
          runner: ${{ inputs.runner }}
          suite: browser-${{ matrix.engine }}
          npm-cache: ${{ steps.npm-cache.outputs.cache-hit }}

  reference-app:
    name: Independent SaaS consumer
    needs: native
    if: ${{ !cancelled() && inputs.runner == 'ubuntu-24.04' && needs.native.outputs.binary-artifact != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: npm-cache
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release
      - run: chmod +x target/release/prnext
      - run: npx playwright install --with-deps chromium
      - name: Locate isolated PostgreSQL tools
        shell: bash
        run: |
          bin=$(pg_config --bindir)
          test -x "$bin/initdb"
          echo "PRNEXT_POSTGRES_BIN=$bin" >> "$GITHUB_ENV"
      - run: npm run test:reference
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reference-consumer-evidence
          path: |
            artifacts/alpha019/reference/qualification.json
            artifacts/alpha019/reference/screenshots/
            artifacts/alpha019/reference/last-command.log
            artifacts/alpha019/reference/last-server.log
            artifacts/reference-postgres/last-start.log
          if-no-files-found: error
          retention-days: 7
      - name: Record setup cache results
        if: always()
        uses: ./.github/actions/ci-metrics
        with:
          runner: ${{ inputs.runner }}
          suite: saas-reference
          npm-cache: ${{ steps.npm-cache.outputs.cache-hit }}

  node26:
    name: Node 26 (${{ matrix.suite }})
    needs: native
    if: ${{ !cancelled() && inputs.runner == 'ubuntu-24.04' && needs.native.outputs.binary-artifact != '' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, browser, reference, package]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release
      - run: chmod +x target/release/prnext
      - name: Install Chromium for browser and SaaS contracts
        if: matrix.suite == 'browser' || matrix.suite == 'reference'
        run: npx playwright install --with-deps chromium
      - name: Locate isolated PostgreSQL tools
        if: matrix.suite == 'reference'
        shell: bash
        run: |
          bin=$(pg_config --bindir)
          test -x "$bin/initdb"
          echo "PRNEXT_POSTGRES_BIN=$bin" >> "$GITHUB_ENV"
      - name: Qualify Node 26 against the same native candidate
        run: node scripts/ci-node26.mjs --suite ${{ matrix.suite }} --output artifacts/node26-qualification/${{ matrix.suite }}.json
      - name: Retain Node and archive provenance on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node26-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/node26-qualification/
            artifacts/npm-package-diagnostics/
            artifacts/alpha019/reference/
            artifacts/reference-postgres/last-start.log
            test-results/
          if-no-files-found: warn
          retention-days: 14

  next-compat:
    name: Next.js reference contracts
    needs: native
    if: ${{ !cancelled() && inputs.runner == 'ubuntu-24.04' && needs.native.outputs.binary-artifact != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: npm-cache
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-native-${{ inputs.runner }}
          path: target/release
      - run: chmod +x target/release/prnext
      - name: Install locked real ecosystem and upstream reference
        run: npm ci --prefix tests/ecosystem --workspaces=false --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare fixtures on the reference filesystem
        run: node -e "require('node:fs').mkdirSync('artifacts/next-fixtures', {recursive:true})"
      - name: Compare real builds, servers and browsers
        env:
          PRNEXT_NEXT_REFERENCE: ${{ github.workspace }}/tests/ecosystem/node_modules/next
          PRNEXT_NEXT_REFERENCE_VERSION: '16.4.4'
          TMPDIR: ${{ github.workspace }}/artifacts/next-fixtures
        run: npm run test:next-compat
      - name: Record setup cache results
        if: always()
        uses: ./.github/actions/ci-metrics
        with:
          runner: ${{ inputs.runner }}
          suite: next-reference
          npm-cache: ${{ steps.npm-cache.outputs.cache-hit }}
