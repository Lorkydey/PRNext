name: Presentation release checks (20 minute diagnostic)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/presentation-release-check.yml'
      - 'tests/performance/presentation-endurance.mjs'
      - 'tests/reference/presentation-*.mjs'
      - 'tests/reference/soak.mjs'
      - 'tests/browser/presentation-deployment.spec.mjs'

permissions:
  contents: read

concurrency:
  group: presentation-release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compact:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:native
      - name: Exercise compact Flight for twenty minutes under two CPU and 5 GiB
        shell: bash
        run: |
          output="$GITHUB_WORKSPACE/artifacts/presentation-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          affinity=$(node -e "const fs=require('fs');const s=fs.readFileSync('/proc/self/status','utf8').match(/^Cpus_allowed_list:\\s*(.+)$/m)[1];const a=s.trim().split(',').flatMap(x=>{const [f,l=f]=x.split('-').map(Number);return Array.from({length:l-f+1},(_,i)=>f+i)});if(a.length<2)throw Error('Two CPUs required');process.stdout.write(a.slice(0,2).join(','))")
          scope_affinity="${affinity//,/ }"
          unit="prnext-presentation-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          cleanup() {
            status=$?
            trap - EXIT
            timeout --kill-after=5s 80s sudo -n systemctl stop "$unit" || true
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sudo systemd-run --wait --pipe --collect --quiet \
            --unit="$unit" --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=CPUQuota=200% --property=MemoryMax=5368709120 --property="AllowedCPUs=$scope_affinity" \
            --property=TimeoutStopSec=70s --property=KillMode=control-group --setenv="PATH=$PATH" \
            taskset --cpu-list "$affinity" "$(command -v node)" tests/performance/presentation-endurance.mjs "$output" "$affinity"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: presentation-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/presentation-runtime-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CHECK_DIRECTORY: ${{ github.workspace }}/artifacts/presentation-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Install disposable runner services
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config postgresql-16 redis-server
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tests/toolchain --workspaces=false --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:native
      - name: Verify presentation, old tabs and real post-cutover rollback
        shell: bash
        run: |
          mkdir -p "$CHECK_DIRECTORY"
          git rev-parse HEAD > "$CHECK_DIRECTORY/source-commit.txt"
          sha256sum target/release/prnext > "$CHECK_DIRECTORY/native-sha256.txt"
          node --test tests/presentation.test.mjs tests/persistent.test.mjs tests/hosting-release.test.mjs 2>&1 | tee "$CHECK_DIRECTORY/http-rollback.log"
          npx playwright test tests/browser/presentation-deployment.spec.mjs tests/browser/deployment-coherence.spec.mjs --workers=1 2>&1 | tee "$CHECK_DIRECTORY/old-tabs.log"
      - name: Run twenty sustained minutes of authenticated SQL and automatic presentation
        shell: bash
        run: |
          affinity=$(node -e "const fs=require('fs');const s=fs.readFileSync('/proc/self/status','utf8').match(/^Cpus_allowed_list:\\s*(.+)$/m)[1];const a=s.trim().split(',').flatMap(x=>{const [f,l=f]=x.split('-').map(Number);return Array.from({length:l-f+1},(_,i)=>f+i)});if(a.length<2)throw Error('Two CPUs required');process.stdout.write(a.slice(0,2).join(','))")
          scope_affinity="${affinity//,/ }"
          unit="prnext-presentation-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          cleanup() {
            status=$?
            trap - EXIT
            timeout --kill-after=5s 80s sudo -n systemctl stop "$unit" || true
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sudo systemd-run --wait --pipe --collect --quiet \
            --unit="$unit" --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=CPUQuota=200% --property=MemoryMax=5368709120 --property="AllowedCPUs=$scope_affinity" \
            --property=TimeoutStopSec=70s --property=KillMode=control-group \
            --setenv="PATH=$PATH" --setenv="GITHUB_ACTIONS=true" --setenv="PRNEXT_SAAS_NATIVE_SOURCE=${{ github.event.pull_request.head.sha || github.sha }}" \
            taskset --cpu-list "$affinity" "$(command -v node)" tests/reference/soak.mjs \
            --run --presentation --diagnostic-seconds 1200 --affinity "$affinity" --output-directory "$CHECK_DIRECTORY/soak" \
            2>&1 | tee "$CHECK_DIRECTORY/soak-driver.log"
      - name: Check the short-run evidence without claiming the two-hour gate
        run: node tests/reference/presentation-admission.mjs "${{ env.CHECK_DIRECTORY }}/soak/soak.json"
      - name: Preserve results and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: presentation-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CHECK_DIRECTORY }}/
            test-results/
          if-no-files-found: error
          retention-days: 14
