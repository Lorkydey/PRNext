name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - name: Install assembler (macOS)
        if: runner.os == 'macOS'
        run: command -v nasm >/dev/null || brew install nasm
      - name: Install assembler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build:native
      - run: npm run test:unit
      - run: npm run test:types
      - run: npm run test:rust
      - name: Integration tests (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Admission tests deliberately open more than 1,500 concurrent sockets.
          echo "Initial descriptor limit: $(ulimit -n)"
          ulimit -n 8192
          npm run test:e2e
      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - run: npm run typecheck --workspace examples/basic
      - run: npm run typecheck --workspace examples/app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
