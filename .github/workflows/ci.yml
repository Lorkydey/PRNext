name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep the tested Linux image stable across ubuntu-latest migrations.
        os: [ubuntu-24.04, macos-14, windows-2022]
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ${{ matrix.os }}
