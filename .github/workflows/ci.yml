name: Remove requested GitHub package
run-name: Remove the requested @lorkydey/prnext distribution

on:
  workflow_dispatch:
    inputs:
      package:
        description: Exact GitHub package requested for removal
        required: true
        type: string

permissions:
  contents: read

jobs:
  remove-requested-package:
    if: github.repository == 'Lorkydey/PRNext' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Remove only the explicitly requested GitHub package
        env:
          GH_PACKAGE_TOKEN: ${{ github.token }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import path from 'node:path';
          assert.equal(process.env.GITHUB_REPOSITORY,'Lorkydey/PRNext');
          assert.equal(process.env.GITHUB_REF,'refs/heads/fix/remove-github-package-20261112');
          assert.equal(process.env.GITHUB_EVENT_NAME,'workflow_dispatch');
          assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');
          assert.equal(process.env.GITHUB_ACTOR_ID,'57268822');
          assert.equal(process.env.REQUESTED_PACKAGE,'@lorkydey/prnext');
          assert.ok(process.env.GH_PACKAGE_TOKEN);
          const target='https://api.github.com/users/Lorkydey/packages/npm/prnext';
          const headers={Authorization:`Bearer ${process.env.GH_PACKAGE_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'PRNext-requested-package-removal','Cache-Control':'no-cache'};
          const result={package:'@lorkydey/prnext',registry:'npm.pkg.github.com',repository:'Lorkydey/PRNext',run:process.env.GITHUB_RUN_ID,source:process.env.GITHUB_SHA,passed:false,deleteStarted:false,deleted:false};
          const file=path.join(process.env.RUNNER_TEMP,'remove-github-package-result.json');
          const save=()=>writeFile(file,JSON.stringify(result,null,2)+'\n');
          await writeFile(file,JSON.stringify(result,null,2)+'\n',{flag:'wx'});
          async function request(url,options={}){
            try{return await fetch(url,{redirect:'error',signal:AbortSignal.timeout(20000),...options});}
            catch{throw new Error('Package removal request did not return a response');}
          }
          async function json(response){assert.equal(response.status,200);const text=await response.text();assert.ok(text.length<8*1024**2);return JSON.parse(text);}
          async function official(){
            const versions={};
            for(const version of ['0.1.22-alpha','0.2.0-alpha']){
              const metadata=await json(await request('https://registry.npmjs.org/%40thomas.f%2Fprnext/'+version));
              assert.equal(metadata.name,'@thomas.f/prnext');assert.equal(metadata.version,version);assert.match(metadata.dist.integrity,/^sha512-/);
              versions[version]=metadata.dist.integrity;
            }return versions;
          }
          try{
            result.officialNpmBefore=await official();await save();
            const response=await request(target,{headers});
            if(response.status===404){result.alreadyAbsent=true;}
            else{
              const metadata=await json(response);
              assert.equal(metadata.name,'prnext');assert.equal(metadata.package_type,'npm');assert.equal(metadata.repository?.full_name,'Lorkydey/PRNext');assert.ok(Number.isSafeInteger(metadata.id)&&metadata.id>0);
              result.packageId=metadata.id;result.visibility=metadata.visibility;await save();
              result.deleteStarted=true;await save();
              // The mutation is deliberately issued only once.
              const removed=await request(target,{method:'DELETE',headers});
              result.deleteStatus=removed.status;await save();assert.equal(removed.status,204);
              result.deleted=true;await save();
            }
            const verification=await request(target,{headers});result.verificationStatus=verification.status;await save();assert.equal(verification.status,404);
            result.officialNpmAfter=await official();assert.deepEqual(result.officialNpmAfter,result.officialNpmBefore);
            result.passed=true;await save();console.log('Requested GitHub package removed; official npm versions unchanged.');
          }catch(error){result.error=error.message;await save();throw error;}
          NODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requested-package-removal-${{ github.run_id }}-1
          path: ${{ runner.temp }}/remove-github-package-result.json
          if-no-files-found: error
