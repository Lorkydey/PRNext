name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build tools (Linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build:native
      - run: npm test
      - run: npm run typecheck --workspace examples/basic
      - run: npm run typecheck --workspace examples/app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
