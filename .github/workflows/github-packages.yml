name: GitHub Packages
run-name: PRNext GitHub package ${{ inputs.version || 'verified release' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version, or auto for the newest verified GitHub release
        required: true
        default: auto
        type: string
  workflow_run:
    workflows: [Publish qualified release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: prnext-github-package
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'Lorkydey/PRNext' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Require a fresh execution
        run: node --input-type=module -e 'if (process.env.GITHUB_RUN_ATTEMPT !== "1") throw Error("Start a fresh dispatch")'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/release-github-package.test.mjs
      - name: Prepare the matching public release
        id: package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISTRIBUTION_VERSION: ${{ inputs.version || 'auto' }}
        run: |
          mkdir -p "$RUNNER_TEMP/github-package-distribution/packed"
          node scripts/release-github-package.mjs prepare --version "$DISTRIBUTION_VERSION" --directory "$RUNNER_TEMP/github-package-distribution/package"
          npm pack "$RUNNER_TEMP/github-package-distribution/package" --ignore-scripts --pack-destination "$RUNNER_TEMP/github-package-distribution/packed"
      - run: npx playwright install --with-deps chromium
      - name: Verify the installed production consumer
        env:
          DISTRIBUTION_VERSION: ${{ steps.package.outputs.version }}
        run: >-
          node tests/github-package-consumer.mjs
          --archive "$RUNNER_TEMP/github-package-distribution/packed/lorkydey-prnext-$DISTRIBUTION_VERSION.tgz"
          --version "$DISTRIBUTION_VERSION"
          --npm-cli "$(readlink -f "$(command -v npm)")"
          --report "$RUNNER_TEMP/github-package-distribution/consumer.json" --browser
      - if: always() && steps.package.conclusion == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-package-distribution/
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          registry-url: https://npm.pkg.github.com
          scope: '@lorkydey'
          package-manager-cache: false
      - name: Require a fresh execution
        run: node --input-type=module -e 'if (process.env.GITHUB_RUN_ATTEMPT !== "1") throw Error("Start a fresh dispatch")'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-package-distribution
      - name: Verify the immutable GitHub package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          DISTRIBUTION_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/release-github-package.mjs publish
          --directory "$RUNNER_TEMP/github-package-distribution/package"
          --archive "$RUNNER_TEMP/github-package-distribution/packed/lorkydey-prnext-$DISTRIBUTION_VERSION.tgz"
          --npm-cli "$(readlink -f "$(command -v npm)")"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-package-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-package-distribution/github-package-result.json
          if-no-files-found: warn
