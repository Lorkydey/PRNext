name: Controlled candidate performance

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      baseline_source:
        description: Exact baseline source commit
        required: true
        default: 75077ab25eb7cfddcae9236cf8a9faa514a39b20
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'performance-qualification'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BASELINE_SOURCE: ${{ inputs.baseline_source || '75077ab25eb7cfddcae9236cf8a9faa514a39b20' }}
      PERFORMANCE_DIRECTORY: ${{ github.workspace }}/artifacts/controlled-performance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native
      - name: Prepare independent source-verified archives and freeze the comparison
        shell: bash
        run: |
          mkdir -p artifacts
          affinity=$(node -e "const fs=require('fs');const s=fs.readFileSync('/proc/self/status','utf8').match(/^Cpus_allowed_list:\\s*(.+)$/m)[1];const a=s.trim().split(',').flatMap(x=>{const [f,l=f]=x.split('-').map(Number);return Array.from({length:l-f+1},(_,i)=>f+i)});if(a.length<2)throw Error('Two CPUs required');process.stdout.write(a.slice(0,2).join(','))")
          node tests/performance/prepare-candidate-comparison.mjs "$BASELINE_SOURCE" "$PERFORMANCE_DIRECTORY" "$affinity"
          echo "PERFORMANCE_AFFINITY=$affinity" >> "$GITHUB_ENV"
      - name: Verify real kernel accounting before the comparison
        shell: bash
        run: |
          scope_affinity="${PERFORMANCE_AFFINITY//,/ }"
          scope="prnext-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-probe.scope"
          sudo systemd-run --scope --quiet --unit="$scope" \
            --property=Delegate=yes --property=CPUQuota=200% --property=MemoryMax=5368709120 --property="AllowedCPUs=$scope_affinity" \
            taskset --cpu-list "$PERFORMANCE_AFFINITY" env "PRNEXT_PERFORMANCE_SCOPE=$scope" "$(command -v node)" \
            tests/performance/cgroup-accounting-probe.mjs "$PERFORMANCE_DIRECTORY/cgroup-probe.json"
      - name: Compare once inside an enforced CPU and memory scope
        shell: bash
        run: |
          scope_affinity="${PERFORMANCE_AFFINITY//,/ }"
          scope="prnext-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.scope"
          sudo systemd-run --scope --quiet --unit="$scope" \
            --property=Delegate=yes --property=CPUQuota=200% --property=MemoryMax=5368709120 --property="AllowedCPUs=$scope_affinity" \
            taskset --cpu-list "$PERFORMANCE_AFFINITY" env "PRNEXT_PERFORMANCE_SCOPE=$scope" "$(command -v node)" \
            tests/performance/release-regression.mjs run "$PERFORMANCE_DIRECTORY/configuration.json" "$PERFORMANCE_DIRECTORY/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: controlled-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PERFORMANCE_DIRECTORY }}/*.json
            ${{ env.PERFORMANCE_DIRECTORY }}/logs/
            ${{ env.PERFORMANCE_DIRECTORY }}/archives/
          if-no-files-found: error
          retention-days: 14
