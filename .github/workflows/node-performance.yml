name: Controlled Node runtime performance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: node-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PERFORMANCE_DIRECTORY: ${{ github.workspace }}/artifacts/node-performance-${{ github.run_id }}-${{ github.run_attempt }}
      CGROUP_PROBE_RECEIPT: ${{ github.workspace }}/artifacts/node-cgroup-preflight-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - name: Retain the exact Node 26 executable path
        shell: bash
        run: echo "COMPARISON_NODE26=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Select the fixed comparison affinity
        shell: bash
        run: |
          mkdir -p artifacts
          affinity=$(node -e "const fs=require('fs');const s=fs.readFileSync('/proc/self/status','utf8').match(/^Cpus_allowed_list:\\s*(.+)$/m)[1];const a=s.trim().split(',').flatMap(x=>{const [f,l=f]=x.split('-').map(Number);return Array.from({length:l-f+1},(_,i)=>f+i)});if(a.length<2)throw Error('Two CPUs required');process.stdout.write(a.slice(0,2).join(','))")
          echo "PERFORMANCE_AFFINITY=$affinity" >> "$GITHUB_ENV"
      - name: Verify kernel accounting before building or measuring
        id: kernel_probe
        shell: bash
        run: |
          scope_affinity="${PERFORMANCE_AFFINITY//,/ }"
          scope="prnext-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-probe.scope"
          sudo systemd-run --scope --quiet --unit="$scope" \
            --property=Delegate=yes --property=CPUQuota=200% --property=MemoryMax=5368709120 --property="AllowedCPUs=$scope_affinity" \
            taskset --cpu-list "$PERFORMANCE_AFFINITY" env "PRNEXT_PERFORMANCE_SCOPE=$scope" "$(command -v node)" \
            tests/performance/cgroup-accounting-probe.mjs "$CGROUP_PROBE_RECEIPT"
      - uses: actions/upload-artifact@v7
        if: always() && steps.kernel_probe.outcome != 'skipped'
        with:
          name: node-kernel-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CGROUP_PROBE_RECEIPT }}
          if-no-files-found: error
          retention-days: 14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native
      - name: Prepare identical archives and independently installed fixtures
        id: prepare_comparison
        run: node tests/performance/prepare-node-comparison.mjs "$COMPARISON_NODE26" "$PERFORMANCE_DIRECTORY" "$PERFORMANCE_AFFINITY"
      - name: Keep the kernel preflight with the frozen comparison
        run: node -e "require('fs').copyFileSync(process.env.CGROUP_PROBE_RECEIPT,process.env.PERFORMANCE_DIRECTORY+'/cgroup-probe.json',require('fs').constants.COPYFILE_EXCL)"
      - name: Compare once with unchanged regression budgets and kernel limits
        shell: bash
        run: |
          scope_affinity="${PERFORMANCE_AFFINITY//,/ }"
          scope="prnext-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.scope"
          sudo systemd-run --scope --quiet --unit="$scope" \
            --property=Delegate=yes --property=CPUQuota=200% --property=MemoryMax=5368709120 --property="AllowedCPUs=$scope_affinity" \
            taskset --cpu-list "$PERFORMANCE_AFFINITY" env "PRNEXT_PERFORMANCE_SCOPE=$scope" "$(command -v node)" \
            tests/performance/release-regression.mjs run "$PERFORMANCE_DIRECTORY/configuration.json" "$PERFORMANCE_DIRECTORY/report.json"
      - uses: actions/upload-artifact@v7
        if: always() && steps.prepare_comparison.outcome != 'skipped'
        with:
          name: node-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PERFORMANCE_DIRECTORY }}/*.json
            ${{ env.PERFORMANCE_DIRECTORY }}/logs/
            ${{ env.PERFORMANCE_DIRECTORY }}/archives/
          if-no-files-found: error
          retention-days: 14
