name: Prepare isolated archive qualification
description: Install the locked dependencies for one qualification runner.
inputs:
  node:
    description: Exact Node runtime
    default: '22.23.4'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node }}
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - run: npm ci --no-audit --no-fund
      shell: bash
